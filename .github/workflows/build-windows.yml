name: Собрать BloodScrape VST3 для Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Скачать файлы проекта
        uses: actions/checkout@v4

      - name: Установить CMake
        uses: lukka/get-cmake@latest

      - name: Подготовить сборку
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Собрать VST3
        run: cmake --build build --config Release

      - name: Найти VST3 и сделать ZIP
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse | Where-Object { $_.Name -eq "BloodScrape.vst3" } | Select-Object -First 1

          if ($null -eq $vst) {
            Write-Error "Файл BloodScrape.vst3 не найден."
            exit 1
          }

          Compress-Archive -Path $vst.FullName -DestinationPath "BloodScrape-Windows-VST3.zip"

      - name: Загрузить готовый VST3
        uses: actions/upload-artifact@v4
        with:
          name: BloodScrape-Windows-VST3
          path: BloodScrape-Windows-VST3.zip
          if-no-files-found: error
